<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c0f1a">
<title>SABEL Advogados Associados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a84c;
    --gold-dim: rgba(201,168,76,0.2);
    --dark: #0c0f1a;
  }

  html, body {
    min-height: 100%;
    background: var(--dark);
    font-family: 'Montserrat', sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 60px;
  }

  /* ── HERO / HEADER ─────────────────────────── */
  .hero {
    width: 100%;
    max-width: 540px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 52px 32px 36px;
    position: relative;
    text-align: center;
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .logo-wrap {
    width: 100%;
    max-width: 280px;
    margin-bottom: 32px;
  }

  .logo-wrap img {
    width: 100%;
    filter: invert(1) brightness(1.05);
  }

  .ornament {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 200px;
    margin: 0 auto 24px;
  }
  .orn-line { height: 1px; flex: 1; background: linear-gradient(to right, transparent, var(--gold)); }
  .orn-line-r { background: linear-gradient(to left, transparent, var(--gold)); }
  .orn-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }

  .nome {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 0.5px;
    color: #fff;
    margin-bottom: 6px;
  }

  .cargo {
    font-size: 9px;
    font-weight: 300;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 32px;
  }

  /* ── CONTACT PILLS ──────────────────────────── */
  .contatos {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 340px;
  }

  .contato-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 18px;
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    text-decoration: none;
    color: rgba(255,255,255,0.75);
    font-size: 12.5px;
    font-weight: 300;
    letter-spacing: 0.2px;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
    cursor: pointer;
    justify-content: space-between;
    user-select: none;
  }

  .contato-item:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(201,168,76,0.3);
    transform: translateX(3px);
  }

  .contato-item:active { transform: scale(0.98); }

  .contato-item svg { flex-shrink: 0; }

  .contato-left {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
  }

  .contato-hint {
    font-size: 9px;
    font-weight: 300;
    letter-spacing: 0.5px;
    opacity: 0.4;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .hint-label {
    margin-top: 18px;
    text-align: center;
    font-size: 9px;
    font-weight: 300;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.25);
  }

  /* ── DIVIDER ────────────────────────────────── */
  .divider {
    width: 100%;
    max-width: 400px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 40px 0 32px;
    padding: 0 24px;
  }
  .div-line { flex: 1; height: 1px; background: rgba(201,168,76,0.2); }
  .div-text {
    font-size: 8.5px;
    font-weight: 200;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--gold);
    white-space: nowrap;
  }

  /* ── QR SECTION ─────────────────────────────── */
  .qr-section {
    width: 100%;
    max-width: 540px;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .qr-row {
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .qr-card {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 20px;
    padding: 20px 24px;
    border-radius: 16px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
  }

  .qr-canvas-wrap {
    border-radius: 10px;
    background: #fff;
    padding: 8px;
    width: 120px;
    height: 120px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .qr-canvas-wrap canvas,
  .qr-canvas-wrap img {
    width: 104px !important;
    height: 104px !important;
    display: block;
    border-radius: 4px;
  }

  .qr-label {
    flex: 1;
  }

  .qr-wa   { border-color: rgba(37,211,102,0.25); }
  .qr-ig   { border-color: rgba(225,48,108,0.25); }
  .qr-pix  { border-color: rgba(50,188,173,0.25); }

  .qr-wa   .qr-canvas-wrap { border: 2px solid #25D366; }
  .qr-ig   .qr-canvas-wrap { border: 2px solid #E1306C; }
  .qr-pix  .qr-canvas-wrap { border: 2px solid #32BCAD; }

  .qr-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    text-align: center;
  }

  .qr-title {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .qr-wa   .qr-title { color: #25D366; }
  .qr-ig   .qr-title { color: #E1306C; }
  .qr-pix  .qr-title { color: #32BCAD; }

  .qr-desc {
    font-size: 9px;
    font-weight: 300;
    color: rgba(255,255,255,0.38);
    line-height: 1.3;
  }

  /* ── FOOTER ─────────────────────────────────── */
  .footer {
    margin-top: 52px;
    font-size: 8.5px;
    font-weight: 200;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
    text-align: center;
  }

  /* corner accent top of page */
  .page-corner-tl, .page-corner-tr {
    position: fixed;
    width: 30px; height: 30px;
    border-color: var(--gold);
    border-style: solid;
    opacity: 0.25;
    pointer-events: none;
    top: 16px;
  }
  .page-corner-tl { left: 16px; border-width: 1px 0 0 1px; }
  .page-corner-tr { right: 16px; border-width: 1px 1px 0 0; }

  @media (max-width: 400px) {
    .nome { font-size: 23px; }
    .logo-wrap { max-width: 220px; }
    .qr-title { font-size: 9px; }
    .qr-desc { font-size: 8px; }
  }
</style>
</head>

<div class="page-corner-tl"></div>
<div class="page-corner-tr"></div>
